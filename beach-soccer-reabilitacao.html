<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banco de Reabilitação · Beach Soccer · BEACHMED</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&family=Inter:wght@300;400;500;600&display=swap');

:root {
  --sand: #E8DCC8;
  --sand-light: #F5EFE3;
  --sand-mid: #D4C4A8;
  --ink: #1A1612;
  --ink-soft: #3D3530;
  --areia: #C4A97D;
  --areia-dark: #A8885A;
  --alert: #C8442A;
  --ok: #3D7A52;
  --caution: #B87820;
  --muted: #8A7D6E;
  --border: #D4C8B0;
  --white: #FDFAF5;
  --female: #8B5E8B;
  --male: #3A6B9E;
  --phase1: #C8442A;
  --phase2: #B87820;
  --phase3: #3A6B9E;
  --phase4: #3D7A52;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--sand-light);
  color: var(--ink);
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  line-height: 1.6;
  min-height: 100vh;
}

/* ── HEADER ── */
.header {
  background: var(--ink);
  padding: 24px 24px 0;
}
.header-top {
  display: flex;
  align-items: baseline;
  gap: 12px;
  margin-bottom: 6px;
}
.logo { font-family:'Syne',sans-serif; font-weight:800; font-size:16px; letter-spacing:.05em; color:var(--areia); }
.tagline { font-family:'DM Mono',monospace; font-size:10px; color:var(--muted); letter-spacing:.08em; text-transform:uppercase; }
.header-title { font-family:'Syne',sans-serif; font-size:24px; font-weight:700; color:var(--sand); line-height:1.1; margin-bottom:4px; }
.header-meta { font-family:'DM Mono',monospace; font-size:10px; color:var(--muted); letter-spacing:.05em; padding-bottom:16px; }

/* ── PHASE LEGEND ── */
.phase-bar {
  display:flex;
  background:var(--ink-soft);
  border-top:1px solid #2E2820;
}
.phase-item {
  flex:1;
  padding:8px 10px;
  text-align:center;
  font-family:'DM Mono',monospace;
  font-size:9px;
  letter-spacing:.06em;
  color:var(--muted);
  border-right:1px solid #2E2820;
  cursor:pointer;
  transition:all .15s;
}
.phase-item:last-child { border-right:none; }
.phase-item .ph-num { font-size:14px; font-weight:500; display:block; margin-bottom:2px; }
.phase-item.p1 .ph-num { color:var(--phase1); }
.phase-item.p2 .ph-num { color:var(--phase2); }
.phase-item.p3 .ph-num { color:var(--phase3); }
.phase-item.p4 .ph-num { color:var(--phase4); }

/* ── NAVIGATION BREADCRUMB ── */
.breadcrumb {
  background:var(--sand);
  border-bottom:1px solid var(--border);
  padding:10px 24px;
  display:flex;
  align-items:center;
  gap:6px;
  flex-wrap:wrap;
  font-family:'DM Mono',monospace;
  font-size:11px;
  min-height:38px;
}
.bc-item { color:var(--muted); cursor:pointer; transition:color .15s; }
.bc-item:hover { color:var(--ink); }
.bc-item.active { color:var(--ink); font-weight:500; }
.bc-sep { color:var(--border); }

/* ── MAIN LAYOUT ── */
.layout {
  display:grid;
  grid-template-columns:220px 1fr;
  min-height:calc(100vh - 120px);
}

/* ── SIDEBAR ── */
.sidebar {
  background:var(--white);
  border-right:1px solid var(--border);
  padding:16px 0;
  position:sticky;
  top:0;
  height:calc(100vh - 120px);
  overflow-y:auto;
}
.sb-section {
  margin-bottom:4px;
}
.sb-section-title {
  font-family:'DM Mono',monospace;
  font-size:9px;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--muted);
  padding:8px 16px 4px;
}
.sb-item {
  padding:8px 16px;
  cursor:pointer;
  font-size:12px;
  color:var(--ink-soft);
  transition:all .15s;
  border-left:2px solid transparent;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}
.sb-item:hover { background:var(--sand-light); color:var(--ink); }
.sb-item.active { background:var(--sand); border-left-color:var(--areia); color:var(--ink); font-weight:500; }
.sb-item .sb-flag {
  font-family:'DM Mono',monospace;
  font-size:8px;
  padding:1px 5px;
  border-radius:2px;
  flex-shrink:0;
}
.sb-item .sb-flag.f { background:#F0E8F0; color:var(--female); border:1px solid #D4B8D4; }
.sb-item .sb-flag.m { background:#E8EEF8; color:var(--male); border:1px solid #B8C8E0; }
.sb-item .sb-flag.fm { background:var(--sand); color:var(--muted); border:1px solid var(--border); }
.sb-divider { height:1px; background:var(--sand); margin:8px 0; }
.sb-region {
  padding:6px 16px;
  font-family:'DM Mono',monospace;
  font-size:9px;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--areia-dark);
  margin-top:8px;
}
.sb-sub {
  padding:7px 16px 7px 28px;
  cursor:pointer;
  font-size:11px;
  color:var(--ink-soft);
  transition:all .15s;
  border-left:2px solid transparent;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}
.sb-sub:hover { background:var(--sand-light); }
.sb-sub.active { background:var(--sand); border-left-color:var(--areia); color:var(--ink); font-weight:500; }

/* ── CONTENT ── */
.content {
  padding:24px;
  max-width:780px;
}

/* ── HOME / SELECT STATE ── */
.home-state {
  padding:40px 0;
  text-align:center;
  color:var(--muted);
}
.home-icon { font-size:40px; margin-bottom:16px; }
.home-title { font-family:'Syne',sans-serif; font-size:18px; color:var(--ink-soft); margin-bottom:8px; }
.home-desc { font-size:13px; line-height:1.7; max-width:320px; margin:0 auto; }

/* ── INJURY HEADER ── */
.injury-header { margin-bottom:20px; }
.injury-region {
  font-family:'DM Mono',monospace;
  font-size:10px;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--areia-dark);
  margin-bottom:4px;
}
.injury-title {
  font-family:'Syne',sans-serif;
  font-size:22px;
  font-weight:700;
  line-height:1.2;
  margin-bottom:8px;
}
.injury-meta {
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:12px;
}
.meta-pill {
  font-family:'DM Mono',monospace;
  font-size:10px;
  letter-spacing:.05em;
  padding:3px 10px;
  border-radius:2px;
  border:1px solid var(--border);
  background:var(--sand);
  color:var(--muted);
}
.meta-pill.female { background:#F0E8F0; color:var(--female); border-color:#D4B8D4; }
.meta-pill.male { background:#E8EEF8; color:var(--male); border-color:#B8C8E0; }

/* ── SEX FLAG BOX ── */
.sex-flag-box {
  border-radius:4px;
  padding:10px 14px;
  margin-bottom:14px;
  font-size:12px;
  display:flex;
  gap:10px;
  align-items:flex-start;
}
.sex-flag-box.female { background:#F8F0F8; border-left:3px solid var(--female); }
.sex-flag-box.male { background:#EEF3FA; border-left:3px solid var(--male); }
.sex-flag-box.both { background:var(--sand); border-left:3px solid var(--areia); }
.sex-flag-box .sfl { font-family:'DM Mono',monospace; font-size:10px; font-weight:500; flex-shrink:0; padding-top:1px; }
.sex-flag-box.female .sfl { color:var(--female); }
.sex-flag-box.male .sfl { color:var(--male); }
.sex-flag-box.both .sfl { color:var(--areia-dark); }

/* ── PHASE TABS ── */
.phase-tabs {
  display:flex;
  gap:4px;
  margin-bottom:16px;
  overflow-x:auto;
}
.phase-tab {
  font-family:'DM Mono',monospace;
  font-size:10px;
  letter-spacing:.06em;
  padding:7px 14px;
  border-radius:2px;
  border:1px solid var(--border);
  background:var(--white);
  color:var(--muted);
  cursor:pointer;
  white-space:nowrap;
  transition:all .15s;
}
.phase-tab:hover { border-color:var(--areia); color:var(--ink); }
.phase-tab.active.p1 { background:var(--phase1); border-color:var(--phase1); color:#fff; }
.phase-tab.active.p2 { background:var(--phase2); border-color:var(--phase2); color:#fff; }
.phase-tab.active.p3 { background:var(--phase3); border-color:var(--phase3); color:#fff; }
.phase-tab.active.p4 { background:var(--phase4); border-color:var(--phase4); color:#fff; }

/* ── PHASE INFO ── */
.phase-info {
  background:var(--white);
  border:1px solid var(--border);
  border-radius:4px;
  padding:14px 16px;
  margin-bottom:16px;
}
.phase-info-header {
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:8px;
}
.phase-badge {
  font-family:'DM Mono',monospace;
  font-size:10px;
  letter-spacing:.06em;
  padding:3px 10px;
  border-radius:2px;
  color:#fff;
}
.phase-badge.p1 { background:var(--phase1); }
.phase-badge.p2 { background:var(--phase2); }
.phase-badge.p3 { background:var(--phase3); }
.phase-badge.p4 { background:var(--phase4); }
.phase-name { font-family:'Syne',sans-serif; font-size:14px; font-weight:600; }
.phase-duration { font-family:'DM Mono',monospace; font-size:11px; color:var(--muted); }
.phase-criteria {
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
  margin-top:10px;
}
.criterion {
  background:var(--sand-light);
  border:1px solid var(--border);
  border-radius:3px;
  padding:8px 10px;
}
.criterion-label {
  font-family:'DM Mono',monospace;
  font-size:9px;
  letter-spacing:.07em;
  text-transform:uppercase;
  color:var(--muted);
  margin-bottom:3px;
}
.criterion-value { font-size:11px; color:var(--ink-soft); line-height:1.4; }

/* ── PROGRESSION CRITERIA ── */
.progression-box {
  background:var(--sand);
  border:1px solid var(--border);
  border-radius:4px;
  padding:12px 14px;
  margin-bottom:16px;
}
.progression-label {
  font-family:'DM Mono',monospace;
  font-size:9px;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--areia-dark);
  margin-bottom:8px;
}
.criteria-grid {
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
}
.crit-item {
  background:var(--white);
  border:1px solid var(--border);
  border-radius:3px;
  padding:8px 10px;
}
.crit-icon { font-size:16px; margin-bottom:4px; }
.crit-name {
  font-family:'DM Mono',monospace;
  font-size:9px;
  letter-spacing:.06em;
  color:var(--muted);
  text-transform:uppercase;
  margin-bottom:2px;
}
.crit-desc { font-size:11px; color:var(--ink-soft); line-height:1.4; }

/* ── EXERCISE BLOCK ── */
.ex-block {
  background:var(--white);
  border:1px solid var(--border);
  border-radius:4px;
  margin-bottom:10px;
  overflow:hidden;
}
.ex-block-header {
  padding:10px 14px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  cursor:pointer;
  user-select:none;
  transition:background .15s;
}
.ex-block-header:hover { background:var(--sand-light); }
.ex-block-left { display:flex; align-items:center; gap:10px; }
.ex-block-icon { font-size:14px; }
.ex-block-title { font-family:'Syne',sans-serif; font-size:13px; font-weight:600; }
.ex-block-tag {
  font-family:'DM Mono',monospace;
  font-size:9px;
  letter-spacing:.06em;
  padding:2px 8px;
  border-radius:2px;
  border:1px solid var(--border);
  color:var(--muted);
  background:var(--sand-light);
}
.ex-chevron { color:var(--muted); font-size:11px; transition:transform .2s; }
.ex-block.collapsed .ex-chevron { transform:rotate(-90deg); }
.ex-block-body {}
.ex-block.collapsed .ex-block-body { display:none; }

/* ── EXERCISE ROW ── */
.ex-row {
  padding:12px 14px;
  border-bottom:1px solid var(--sand-light);
  display:grid;
  grid-template-columns:28px 1fr;
  gap:10px;
}
.ex-row:last-child { border-bottom:none; }
.ex-num { font-family:'DM Mono',monospace; font-size:10px; color:var(--areia); padding-top:2px; }
.ex-name { font-weight:500; font-size:13px; margin-bottom:2px; }
.ex-prescription { font-size:11px; color:var(--muted); margin-bottom:4px; }
.ex-levels { display:flex; flex-direction:column; gap:3px; margin:5px 0; }
.level-row { display:flex; align-items:flex-start; gap:8px; font-size:11px; }
.level-tag {
  font-family:'DM Mono',monospace;
  font-size:9px;
  padding:1px 7px;
  border-radius:2px;
  min-width:28px;
  text-align:center;
  flex-shrink:0;
  margin-top:1px;
}
.level-tag.n1 { background:#EEF4F0; color:var(--ok); border:1px solid #B4D4BE; }
.level-tag.n2 { background:#FDF7EE; color:var(--caution); border:1px solid #E8C880; }
.level-tag.n3 { background:#FDF0EE; color:var(--alert); border:1px solid #E8A898; }
.ex-note {
  font-size:11px;
  background:var(--sand-light);
  padding:5px 8px;
  border-radius:3px;
  border-left:2px solid var(--areia);
  margin-top:4px;
  color:var(--ink-soft);
  line-height:1.5;
}
.ex-note.sex-f { border-left-color:var(--female); background:#F8F0F8; }
.ex-note.sex-m { border-left-color:var(--male); background:#EEF3FA; }
.ex-evidence {
  font-family:'DM Mono',monospace;
  font-size:9px;
  letter-spacing:.04em;
  color:var(--muted);
  margin-top:4px;
}
.ex-tags { display:flex; gap:4px; flex-wrap:wrap; margin-top:4px; }
.ex-tag {
  font-family:'DM Mono',monospace;
  font-size:9px;
  letter-spacing:.04em;
  padding:1px 6px;
  border-radius:2px;
  background:var(--sand);
  color:var(--muted);
  border:1px solid var(--border);
}

/* ── RTS CRITERIA ── */
.rts-box {
  background:var(--white);
  border:1px solid var(--ok);
  border-radius:4px;
  padding:14px 16px;
  margin-bottom:16px;
}
.rts-title {
  font-family:'Syne',sans-serif;
  font-size:14px;
  font-weight:600;
  color:var(--ok);
  margin-bottom:10px;
}
.rts-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.rts-item {
  background:var(--sand-light);
  border:1px solid var(--border);
  border-radius:3px;
  padding:8px 10px;
  font-size:11px;
  line-height:1.5;
}
.rts-item strong { display:block; font-family:'DM Mono',monospace; font-size:9px; color:var(--ok); letter-spacing:.06em; text-transform:uppercase; margin-bottom:3px; }

/* ── VIDEO PLAYER ── */
.ex-video {
  margin-top:8px;
  border-radius:4px;
  overflow:hidden;
  background:var(--ink);
  position:relative;
}
.ex-video iframe {
  width:100%;
  height:200px;
  border:none;
  display:block;
}
.ex-video-label {
  font-family:'DM Mono',monospace;
  font-size:9px;
  letter-spacing:.06em;
  color:var(--muted);
  padding:4px 8px;
  background:var(--ink);
  text-align:center;
}

/* ── VIDEO INPUT ── */
.ex-video-input {
  margin-top:8px;
  display:flex;
  flex-direction:column;
  gap:5px;
}
.ex-video-input-label {
  font-family:'DM Mono',monospace;
  font-size:9px;
  letter-spacing:.06em;
  color:var(--muted);
  text-transform:uppercase;
}
.ex-video-input input {
  width:100%;
  background:var(--sand-light);
  border:1px dashed var(--border);
  border-radius:3px;
  padding:7px 10px;
  font-family:'DM Mono',monospace;
  font-size:11px;
  color:var(--ink);
  outline:none;
  transition:border-color .15s;
}
.ex-video-input input:focus {
  border-color:var(--areia);
  border-style:solid;
}
.ex-video-input input::placeholder { color:var(--muted); }

/* ── EVIDENCE TAG ── */
.ev-badge {
  display:inline-flex;
  align-items:center;
  gap:4px;
  font-family:'DM Mono',monospace;
  font-size:9px;
  letter-spacing:.04em;
  padding:2px 7px;
  border-radius:2px;
  background:var(--sand);
  border:1px solid var(--border);
  color:var(--muted);
}

/* ── MOBILE MENU ── */
.mobile-menu-btn {
  display:none;
  width:100%;
  background:var(--ink-soft);
  border:none;
  border-bottom:1px solid #2E2820;
  color:var(--sand);
  padding:12px 24px;
  font-family:'DM Mono',monospace;
  font-size:11px;
  letter-spacing:.06em;
  text-align:left;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.mobile-menu-btn .mmb-left { display:flex; align-items:center; gap:8px; }
.mobile-menu-btn .mmb-icon { font-size:16px; }
.mobile-overlay {
  display:none;
  position:fixed;
  top:0; left:0; right:0; bottom:0;
  background:rgba(0,0,0,0.5);
  z-index:200;
}
.mobile-drawer {
  display:none;
  position:fixed;
  top:0; left:0; bottom:0;
  width:80%;
  max-width:320px;
  background:var(--white);
  z-index:300;
  overflow-y:auto;
  padding:16px 0;
  box-shadow:4px 0 20px rgba(0,0,0,0.3);
}
.mobile-drawer.open { display:block; }
.mobile-overlay.open { display:block; }
.mobile-drawer-header {
  padding:12px 16px 16px;
  border-bottom:1px solid var(--border);
  margin-bottom:8px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.mobile-drawer-title { font-family:'Syne',sans-serif; font-size:14px; font-weight:700; color:var(--ink); }
.mobile-drawer-close {
  background:none;
  border:none;
  font-size:18px;
  color:var(--muted);
  cursor:pointer;
  padding:4px;
}

@media (max-width:600px) {
  .layout { grid-template-columns:1fr; }
  .sidebar { display:none; }
  .mobile-menu-btn { display:flex; }
  .phase-criteria, .criteria-grid { grid-template-columns:1fr; }
  .rts-grid { grid-template-columns:1fr; }
  .content { padding:16px; }
}
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <span class="logo">BEACHMED</span>
    <span class="tagline">Além da areia, existe ciência</span>
  </div>
  <div class="header-title">Banco de Reabilitação · Beach Soccer</div>
  <div class="header-meta">Gabi Vila Real · CREFITO 261789-F · Protocolos baseados em evidência · ♀ ♂ flags de especificidade por sexo</div>
</div>

<div class="phase-bar">
  <div class="phase-item p1"><span class="ph-num">F1</span>PROTEÇÃO</div>
  <div class="phase-item p2"><span class="ph-num">F2</span>RECUPERAÇÃO</div>
  <div class="phase-item p3"><span class="ph-num">F3</span>FUNCIONAL</div>
  <div class="phase-item p4"><span class="ph-num">F4</span>RTS-BEACH</div>
</div>

<div class="breadcrumb" id="breadcrumb">
  <span class="bc-item active" onclick="goHome()">Beach Soccer</span>
</div>

<button class="mobile-menu-btn" onclick="openMobileMenu()">
  <span class="mmb-left"><span class="mmb-icon">🏖️</span><span id="mmbLabel">Selecione uma lesão</span></span>
  <span>☰</span>
</button>

<div class="mobile-overlay" id="mobileOverlay" onclick="closeMobileMenu()"></div>
<div class="mobile-drawer" id="mobileDrawer">
  <div class="mobile-drawer-header">
    <span class="mobile-drawer-title">Beach Soccer · Lesões</span>
    <button class="mobile-drawer-close" onclick="closeMobileMenu()">✕</button>
  </div>
  <div id="mobileDrawerContent"></div>
</div>

<div class="layout">
  <div class="sidebar" id="sidebar"></div>
  <div class="content" id="content"></div>
</div>

<script>
// ════════════════════════════════════════════════════════════════════════════
// DATA
// ════════════════════════════════════════════════════════════════════════════

const REGIONS = [
  { id:'coxa', label:'Coxa', icon:'🦵' },
  { id:'joelho', label:'Joelho', icon:'🦿' },
  { id:'tornozelo', label:'Tornozelo / Pé', icon:'🦶' },
  { id:'quadril', label:'Quadril / Pelve', icon:'⚙️' },
  { id:'lombar', label:'Coluna Lombar', icon:'🔗' },
  { id:'cabeca', label:'Cabeça / Cervical', icon:'🧠' },

// ════════════════════════════════════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════════════════════════════════════
let state = { region:null, injury:null, phase:'p1' };

// ════════════════════════════════════════════════════════════════════════════
// SIDEBAR
// ════════════════════════════════════════════════════════════════════════════
function buildSidebar() {
  const sb = document.getElementById('sidebar');
  let html = '';
  REGIONS.forEach(r => {
    const injuries = Object.entries(INJURIES).filter(([k,v]) => v.region === r.id);
    if (!injuries.length) return;
    html += `<div class="sb-region">${r.icon} ${r.label}</div>`;
    injuries.forEach(([k,v]) => {
      const flagCls = v.sexFlag === 'female' ? 'f' : v.sexFlag === 'male' ? 'm' : 'fm';
      const flagTxt = v.sexFlag === 'female' ? '♀' : v.sexFlag === 'male' ? '♂' : '♀♂';
      const active = state.injury === k;
      html += `<div class="sb-sub ${active?'active':''}" onclick="selectInjury('${k}')">
        <span>${v.label}</span>
        <span class="sb-flag ${flagCls}">${flagTxt}</span>
      </div>`;
    });
  });
  sb.innerHTML = html;
}

// ════════════════════════════════════════════════════════════════════════════
// BREADCRUMB
// ════════════════════════════════════════════════════════════════════════════
function buildBreadcrumb() {
  const bc = document.getElementById('breadcrumb');
  let html = `<span class="bc-item ${!state.injury?'active':''}" onclick="goHome()">Beach Soccer</span>`;
  if (state.region) {
    const r = REGIONS.find(r => r.id === state.region);
    html += `<span class="bc-sep">›</span><span class="bc-item">${r?r.label:''}</span>`;
  }
  if (state.injury) {
    const inj = INJURIES[state.injury];
    html += `<span class="bc-sep">›</span><span class="bc-item active">${inj.label}</span>`;
  }
  bc.innerHTML = html;
}

// ════════════════════════════════════════════════════════════════════════════
// HOME
// ════════════════════════════════════════════════════════════════════════════
function goHome() {
  state = { region:null, injury:null, phase:'p1' };
  buildSidebar(); buildBreadcrumb(); renderContent();
}

function renderContent() {
  if (!state.injury) { renderHome(); return; }
  renderInjury();
}

function renderHome() {
  const el = document.getElementById('content');
  el.innerHTML = `<div class="home-state">
    <div class="home-icon">🏖️</div>
    <div class="home-title">Selecione uma lesão</div>
    <div class="home-desc">Navegue pelas regiões anatômicas no menu lateral e selecione a lesão para acessar o protocolo de reabilitação por fases.</div>
  </div>`;
}

// ════════════════════════════════════════════════════════════════════════════
// SELECT INJURY
// ════════════════════════════════════════════════════════════════════════════
function selectInjury(key) {
  state.injury = key;
  state.region = INJURIES[key].region;
  state.phase = 'p1';
  buildSidebar(); buildBreadcrumb(); renderInjury();
}

// ════════════════════════════════════════════════════════════════════════════
// RENDER INJURY
// ════════════════════════════════════════════════════════════════════════════
function renderInjury() {
  const inj = INJURIES[state.injury];
  const ph = inj.phases[state.phase];
  const el = document.getElementById('content');
  let html = '';

  // Header
  const regionLabel = REGIONS.find(r => r.id === inj.region)?.label || '';
  html += `<div class="injury-header">
    <div class="injury-region">${regionLabel}</div>
    <div class="injury-title">${inj.label}</div>
    <div class="injury-meta">
      ${inj.sexFlag === 'female' ? '<span class="meta-pill female">♀ Maior prevalência feminina</span>' :
        inj.sexFlag === 'male' ? '<span class="meta-pill male">♂ Maior prevalência masculina</span>' :
        '<span class="meta-pill">♀♂ Ambos os sexos</span>'}
      <span class="meta-pill">Beach Soccer</span>
      <span class="meta-pill">${inj.refs.split('·')[0].trim()}</span>
    </div>
  </div>`;

  // Sex flag
  html += `<div class="sex-flag-box ${inj.sexFlag === 'female' ? 'female' : inj.sexFlag === 'male' ? 'male' : 'both'}">
    <span class="sfl">${inj.sexFlag === 'female' ? '♀' : inj.sexFlag === 'male' ? '♂' : '♀♂'}</span>
    <span>${inj.sexNote}</span>
  </div>`;

  // Phase tabs
  html += `<div class="phase-tabs">`;
  ['p1','p2','p3','p4'].forEach(p => {
    const ph2 = inj.phases[p];
    const labels = {p1:'F1 · Proteção', p2:'F2 · Recuperação', p3:'F3 · Funcional', p4:'F4 · RTS-Beach'};
    html += `<div class="phase-tab ${p} ${state.phase===p?'active':''}" onclick="selectPhase('${p}')">${labels[p]}</div>`;
  });
  html += `</div>`;

  // Phase info
  html += `<div class="phase-info">
    <div class="phase-info-header">
      <span class="phase-badge ${state.phase}">${state.phase.toUpperCase()}</span>
      <span class="phase-name">${ph.name}</span>
      <span class="phase-duration">${ph.duration}</span>
    </div>
    <div class="phase-criteria">
      <div class="criterion"><div class="criterion-label">EVA</div><div class="criterion-value">${ph.criteria.eva}</div></div>
      <div class="criterion"><div class="criterion-label">Amplitude</div><div class="criterion-value">${ph.criteria.amplitude}</div></div>
      <div class="criterion"><div class="criterion-label">Funcional</div><div class="criterion-value">${ph.criteria.funcional}</div></div>
    </div>
  </div>`;

  // Progression criteria (not in p4)
  if (ph.progression) {
    html += `<div class="progression-box">
      <div class="progression-label">Critérios de progressão para próxima fase</div>
      <div class="criteria-grid">
        <div class="crit-item"><div class="crit-icon">⏱</div><div class="crit-name">Tempo</div><div class="crit-desc">${ph.progression.tempo}</div></div>
        <div class="crit-item"><div class="crit-icon">📊</div><div class="crit-name">Queixa</div><div class="crit-desc">${ph.progression.queixa}</div></div>
        <div class="crit-item"><div class="crit-icon">🎯</div><div class="crit-name">Padrão de Movimento</div><div class="crit-desc">${ph.progression.padrao}</div></div>
      </div>
    </div>`;
  }

  // Sex specific in phase
  if (ph.sexSpecific) {
    html += `<div class="sex-flag-box ${ph.sexSpecific.cls}">
      <span class="sfl">${ph.sexSpecific.label}</span>
      <span>${ph.sexSpecific.text}</span>
    </div>`;
  }

  // RTS criteria (p4)
  if (ph.rts) {
    html += `<div class="rts-box"><div class="rts-title">✓ Critérios de Alta / RTS-Beach</div>
      <div class="rts-grid">${ph.rts.map(r => `<div class="rts-item"><strong>${r.label}</strong>${r.value}</div>`).join('')}</div>
    </div>`;
  }

  // Exercise groups
  ph.groups.forEach((group, gi) => {
    const colKey = `inj_${state.injury}_${state.phase}_g${gi}`;
    const collapsed = localStorage.getItem(colKey) === '1';
    html += `<div class="ex-block ${collapsed?'collapsed':''}" id="exblock_${gi}">
      <div class="ex-block-header" onclick="toggleGroup(${gi})">
        <div class="ex-block-left">
          <span class="ex-block-icon">${group.icon}</span>
          <span class="ex-block-title">${group.title}</span>
          <span class="ex-block-tag">${group.tag}</span>
        </div>
        <span class="ex-chevron">▾</span>
      </div>
      <div class="ex-block-body">`;

    group.exercises.forEach((ex, ei) => {
      const levelsHtml = ex.levels ? '<div class="ex-levels">' + ex.levels.map(l =>
        '<div class="level-row"><span class="level-tag ' + l.cls + '">' + l.tag + '</span><span>' + l.text + '</span></div>'
      ).join('') + '</div>' : '';
      const noteCls = ex.note && ex.note.includes('♀') ? 'sex-f' : ex.note && ex.note.includes('♂') ? 'sex-m' : '';
      const noteHtml = ex.note ? '<div class="ex-note ' + noteCls + '">' + ex.note + '</div>' : '';
      const evidenceHtml = ex.evidence ? '<div class="ex-evidence">📎 ' + ex.evidence + '</div>' : '';
      const tagsHtml = ex.tags && ex.tags.length ? '<div class="ex-tags">' + ex.tags.map(t => '<span class="ex-tag">' + t + '</span>').join('') + '</div>' : '';
      const videoId = ex.video || '';
      let videoHtml = '';
      if (videoId) {
        videoHtml = '<div class="ex-video"><div class="ex-video-label">▶ DEMONSTRAÇÃO</div><iframe src="https://www.youtube.com/embed/' + videoId + '?rel=0&modestbranding=1" allowfullscreen loading="lazy"></iframe></div>';
      } else {
        const inputId = 'vi_' + gi + '_' + ei;
        videoHtml = '<div class="ex-video-input"><span class="ex-video-input-label">📎 Adicionar vídeo</span><input id="' + inputId + '" type="text" placeholder="Cole o link do YouTube aqui..." onchange="saveVideo(this)" data-key="video_' + state.injury + '_' + gi + '_' + ei + '" value="' + (localStorage.getItem('video_' + state.injury + '_' + gi + '_' + ei) || '') + '"/>' + (localStorage.getItem('video_' + state.injury + '_' + gi + '_' + ei) ? '<div class="ex-video"><div class="ex-video-label">▶ SEU VÍDEO</div><iframe src="' + ytEmbed(localStorage.getItem('video_' + state.injury + '_' + gi + '_' + ei)) + '" allowfullscreen loading="lazy"></iframe></div>' : '') + '</div>';
      }
      html += '<div class="ex-row">'
        + '<div class="ex-num">' + String(ei+1).padStart(2,'0') + '</div>'
        + '<div>'
        + '<div class="ex-name">' + ex.name + '</div>'
        + '<div class="ex-prescription">' + ex.presc + '</div>'
        + levelsHtml + noteHtml + evidenceHtml + tagsHtml + videoHtml
        + '</div></div>';
    });

    html += `</div></div>`;
  });

  el.innerHTML = html;
}

// ════════════════════════════════════════════════════════════════════════════
// INTERACTIONS
// ════════════════════════════════════════════════════════════════════════════
function selectPhase(p) {
  state.phase = p;
  renderInjury();
}

function toggleGroup(gi) {
  const el = document.getElementById(`exblock_${gi}`);
  const c = el.classList.toggle('collapsed');
  localStorage.setItem(`inj_${state.injury}_${state.phase}_g${gi}`, c?'1':'0');
}

// ════════════════════════════════════════════════════════════════════════════
// VIDEO HELPERS
// ════════════════════════════════════════════════════════════════════════════
function ytEmbed(url) {
  if (!url) return '';
  // Suporta youtube.com/watch?v=ID, youtu.be/ID, youtube.com/shorts/ID
  const m = url.match(/(?:v=|youtu\.be\/|shorts\/)([a-zA-Z0-9_-]{11})/);
  if (m) return 'https://www.youtube.com/embed/' + m[1] + '?rel=0&modestbranding=1';
  // Se já for só o ID (11 chars)
  if (/^[a-zA-Z0-9_-]{11}$/.test(url.trim())) return 'https://www.youtube.com/embed/' + url.trim() + '?rel=0&modestbranding=1';
  return '';
}

function saveVideo(input) {
  const key = input.getAttribute('data-key');
  const val = input.value.trim();
  if (val) {
    localStorage.setItem(key, val);
  } else {
    localStorage.removeItem(key);
  }
  renderInjury(); // re-renderiza para mostrar o player
}

// ════════════════════════════════════════════════════════════════════════════
// MOBILE MENU
// ════════════════════════════════════════════════════════════════════════════
function buildMobileDrawer() {
  const REGIONS_ORDER = ['coxa','joelho','tornozelo','quadril','lombar','cabeca'];
  const regionLabels = {coxa:'🦵 Coxa', joelho:'🦿 Joelho', tornozelo:'🦶 Tornozelo / Pé', quadril:'⚙️ Quadril / Pelve', lombar:'🔗 Coluna Lombar', cabeca:'🧠 Cabeça / Cervical'};
  let html = '';
  REGIONS_ORDER.forEach(rid => {
    const injuries = Object.entries(INJURIES).filter(([k,v]) => v.region === rid);
    if (!injuries.length) return;
    html += `<div style="padding:6px 16px 2px;font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--areia-dark);margin-top:8px">${regionLabels[rid]}</div>`;
    injuries.forEach(([k,v]) => {
      const flagCls = v.sexFlag==='female'?'f':v.sexFlag==='male'?'m':'fm';
      const flagTxt = v.sexFlag==='female'?'♀':v.sexFlag==='male'?'♂':'♀♂';
      const active = state.injury === k;
      html += `<div style="padding:10px 16px 10px 28px;cursor:pointer;font-size:12px;color:var(--ink-soft);border-left:2px solid ${active?'var(--areia)':'transparent'};background:${active?'var(--sand)':'transparent'};display:flex;align-items:center;justify-content:space-between;gap:8px" onclick="selectInjuryMobile('${k}')">
        <span>${v.label}</span>
        <span style="font-family:'DM Mono',monospace;font-size:8px;padding:1px 5px;border-radius:2px;background:${flagCls==='f'?'#F0E8F0':flagCls==='m'?'#E8EEF8':'var(--sand)'};color:${flagCls==='f'?'var(--female)':flagCls==='m'?'var(--male)':'var(--muted)'};border:1px solid ${flagCls==='f'?'#D4B8D4':flagCls==='m'?'#B8C8E0':'var(--border)'}">${flagTxt}</span>
      </div>`;
    });
  });
  document.getElementById('mobileDrawerContent').innerHTML = html;
}

function openMobileMenu() {
  buildMobileDrawer();
  document.getElementById('mobileDrawer').classList.add('open');
  document.getElementById('mobileOverlay').classList.add('open');
}

function closeMobileMenu() {
  document.getElementById('mobileDrawer').classList.remove('open');
  document.getElementById('mobileOverlay').classList.remove('open');
}

function selectInjuryMobile(key) {
  closeMobileMenu();
  selectInjury(key);
  const inj = INJURIES[key];
  document.getElementById('mmbLabel').textContent = inj.label;
}
